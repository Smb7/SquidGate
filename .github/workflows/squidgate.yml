name: SquidGate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  squidgate:
    # GitHub-hosted: the self-hosted pool is not currently acquiring jobs, and
    # fork PR code must not run on private infrastructure.
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: SquidGate
        if: env.LLM_API_KEY != ''
        uses: ./
        with:
          llm-api-key: ${{ env.LLM_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          llm-provider: custom
          llm-model: grok-build-0.1
          llm-base-url: https://api.x.ai/v1

      - name: SquidGate skipped for fork pull requests
        if: env.LLM_API_KEY == '' && github.event.pull_request.head.repo.fork
        run: |
          echo "::notice title=SquidGate::Fork pull requests do not receive LLM_API_KEY, so the diff was not scanned. A maintainer reviews these changes."

      - name: SquidGate not configured
        if: env.LLM_API_KEY == '' && !github.event.pull_request.head.repo.fork
        run: |
          echo "::notice title=SquidGate::Add repository secret LLM_API_KEY to enable the PR security gate."

